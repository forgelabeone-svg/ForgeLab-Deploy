    <!-- Critical CSS - Prevents FOUC -->
    <style>
      :root {
        --cyber-black: #0a0a0f;
        --cyber-dark: #0d0d14;
        --cyber-panel: #12121a;
        --cyber-surface: #1a1a25;
        --cyber-border: #2a2a3a;
        --cyber-text: #e0e0e8;
        --cyber-muted: #8888a0;
        --cyber-cyan: #00f5ff;
        --cyber-magenta: #ff00ff;
        --cyber-purple: #8b5cf6;
        --cyber-pink: #ec4899;
        --cyber-blue: #3b82f6;
        --cyber-green: #10b981;
        --cyber-red: #ef4444;
        --cyber-yellow: #f59e0b;
      }
      
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--cyber-black);
        color: var(--cyber-text);
        scroll-behavior: smooth;
      }
      
      body {
        min-height: 100vh;
        background: var(--cyber-black);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
        width: 100%;
      }
      
      /* Scanline Overlay */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.03) 2px,
          rgba(0, 0, 0, 0.03) 4px
        );
      }
      
      /* Neural Grid Background */
      .neural-grid {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
          linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px),
          linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        z-index: -1;
      }
      
      /* Glow Effects */
      .glow-cyan {
        box-shadow: 0 0 20px rgba(0, 245, 255, 0.5), 0 0 40px rgba(0, 245, 255, 0.3);
      }
      
      .glow-magenta {
        box-shadow: 0 0 20px rgba(255, 0, 255, 0.5), 0 0 40px rgba(255, 0, 255, 0.3);
      }
      
      .glow-purple {
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.5), 0 0 40px rgba(139, 92, 246, 0.3);
      }
      
      .text-glow-cyan {
        text-shadow: 0 0 10px rgba(0, 245, 255, 0.8), 0 0 20px rgba(0, 245, 255, 0.5), 0 0 30px rgba(0, 245, 255, 0.3);
      }
      
      .text-glow-magenta {
        text-shadow: 0 0 10px rgba(255, 0, 255, 0.8), 0 0 20px rgba(255, 0, 255, 0.5), 0 0 30px rgba(255, 0, 255, 0.3);
      }
      
      /* Glass Panel */
      .glass-panel {
        background: rgba(18, 18, 26, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(42, 42, 58, 0.8);
        border-radius: 12px;
      }
      
      /* Animations */
      @keyframes pulse-glow {
        0%, 100% {
          box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
        }
        50% {
          box-shadow: 0 0 40px rgba(0, 245, 255, 0.6), 0 0 60px rgba(0, 245, 255, 0.4);
        }
      }
      
      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      
      @keyframes rotate-slow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      
      @keyframes glitch {
        0%, 100% {
          transform: translate(0);
          opacity: 1;
        }
        20% {
          transform: translate(-2px, 2px);
          opacity: 0.8;
        }
        40% {
          transform: translate(2px, -2px);
          opacity: 0.9;
        }
        60% {
          transform: translate(-1px, -1px);
          opacity: 0.85;
        }
        80% {
          transform: translate(1px, 1px);
          opacity: 0.95;
        }
      }
      
      @keyframes typewriter {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }
      
      @keyframes blink {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      
      @keyframes energy-flow {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 100% 50%;
        }
      }
      
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      
      @keyframes slide-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes scale-in {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      
      .animate-pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }
      
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      
      .animate-rotate-slow {
        animation: rotate-slow 20s linear infinite;
      }
      
      .animate-glitch {
        animation: glitch 0.3s ease-in-out;
      }
      
      .animate-typewriter {
        animation: typewriter 2s steps(40) forwards;
      }
      
      .animate-blink {
        animation: blink 1s step-end infinite;
      }
      
      .animate-energy-flow {
        animation: energy-flow 2s linear infinite;
      }
      
      .animate-fade-in {
        animation: fade-in 1s ease-out forwards;
      }
      
      .animate-slide-up {
        animation: slide-up 0.8s ease-out forwards;
      }
      
      .animate-scale-in {
        animation: scale-in 0.6s ease-out forwards;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      
      ::-webkit-scrollbar-track {
        background: var(--cyber-dark);
      }
      
      ::-webkit-scrollbar-thumb {
        background: var(--cyber-border);
        border-radius: 3px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: var(--cyber-cyan);
      }
      
      /* Font Loading */
      .font-loading {
        visibility: hidden;
