<!DOCTYPE html>
<html lang="hu">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Komplex időalapú döntés- és erőforrás-szimulátor - Offline-first webalkalmazás">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="dark light">
    <title>ResourceFlow Szimulátor</title>
    
    <!-- PWA Manifest for offline capability -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E">
    
    <style>
        /* Critical CSS for initial load */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        #root {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 1rem;
            color: #94a3b8;
            font-size: 0.875rem;
        }
        
        noscript {
            display: block;
            padding: 2rem;
            text-align: center;
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
        }
        
        noscript h1 {
            color: #ef4444;
            margin-bottom: 1rem;
        }
    </style>
  <script type="module" crossorigin src="/assets/index-097kpSAZ.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-LzZ6ZPwL.css">
</head>
<body>
    <noscript>
        <h1>⚠️ JavaScript szükséges</h1>
        <p>Ez az alkalmazás JavaScript-et igényel a működéshez.</p>
        <p>Kérjük, engedélyezze a JavaScript-et a böngészőjében az alkalmazás használatához.</p>
    </noscript>
    
    <div id="root">
        <div class="loading-screen" id="initial-loader">
            <div class="loading-spinner"></div>
            <div class="loading-text">Szimulátor betöltése...</div>
        </div>
    </div>
    
    
    <script crossorigin type="module">
        // Remove loader when app mounts
        window.addEventListener('load', () => {
            const loader = document.getElementById('initial-loader');
            if (loader && loader.parentElement === document.getElementById('root')) {
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 300);
                }, 500);
            }
        });
    </script>
</body>
</html>
